[tool.poetry]
name = "kb-builder"
version = "0.1.0"
description = ""
authors = ["Research Desk Contributors"]
readme = "README.md"
packages = [{include = "kb_builder", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
openai-whisper = {git = "https://github.com/openai/whisper.git"}
moviepy = "^1.0.3"
timm = "1.0.13"

pypdf = "^4.2.0"
pdfplumber = "^0.11.0"
pytest = "^8.2.0"
pydub = "^0.25.1"

torch = { version = ">=2.5.1", markers = "platform_system == 'Darwin'" }
python-docx = "^1.1.2"
nltk = "^3.9.1"
google-generativeai = {version = "^0.8.3", source = "pypi"}
datasets = "^3.2.0"
pymupdf = "^1.25.2"
opt-einsum = "^3.4.0"
litellm = "^1.80.11"
spacy = "^3.8.4"
thinc-apple-ops = "^1.0.0"
pyserini = "^0.44.0"
flagembedding = "^1.3.4"
tenacity = "^9.0.0"

[tool.poetry.dev-dependencies]
shared = {path = "../shared", develop=true}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = ["--tb=short"]
